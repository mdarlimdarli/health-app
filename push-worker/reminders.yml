# Vorlage für das private Repo health-data: nach .github/workflows/reminders.yml kopieren.
# Verschickt Push-Erinnerungen an die in subscriptions.json hinterlegten Geräte.
name: Erinnerungen senden

on:
  schedule:
    # Diese Zeilen erzeugt die App unter Einstellungen > Erinnerungen > Zeitplan (Zeiten in UTC).
    # Beispiel für 08:00 und 20:00 in Europe/Berlin, je Winter- und Sommerzeit:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: web-push installieren
        run: npm install --no-save --no-package-lock web-push@3.6.7

      - name: Erinnerungen senden
        run: node push/send-reminders.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

      # Merken, was heute schon verschickt wurde, und abgelaufene Abos entfernen
      - name: Zustand sichern
        run: |
          git config user.name "health-reminders"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reminders-state.json subscriptions.json
          if ! git diff --cached --quiet; then
            git commit -m "Erinnerungen verschickt"
            git pull --rebase
            git push
          fi

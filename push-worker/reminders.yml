# Vorlage für das private Daten-Repo (Standard health-data): nach .github/workflows/reminders.yml kopieren,
# das Script nach push/send-reminders.mjs. Verschickt Push-Mitteilungen an die in subscriptions.json
# hinterlegten Geräte. Secrets: VAPID_PUBLIC_KEY und VAPID_PRIVATE_KEY, optional VAPID_SUBJECT.
name: Erinnerungen senden

on:
  schedule:
    # Zeiten in UTC, je Uhrzeit eine Zeile für Sommer- (UTC+2) und eine für Winterzeit (UTC+1).
    # Das Script prüft die Uhrzeit in Europe/Berlin und schickt je Uhrzeit nur einmal am Tag.
    # Die passenden Zeilen für eigene Uhrzeiten zeigt die App unter Einstellungen > Erinnerungen.
    - cron: '30 5 * * *'   # 07:30 Sommerzeit
    - cron: '30 6 * * *'   # 07:30 Winterzeit
    - cron: '30 10 * * *'  # 12:30 Sommerzeit
    - cron: '30 11 * * *'  # 12:30 Winterzeit
    - cron: '30 18 * * *'  # 20:30 Sommerzeit
    - cron: '30 19 * * *'  # 20:30 Winterzeit
    - cron: '0 20 * * *'   # 22:00 Nachhaken, Sommerzeit
    - cron: '0 21 * * *'   # 22:00 Nachhaken, Winterzeit
  # Manuell oder aus der App ("Test-Mitteilung senden") starten
  workflow_dispatch:
    inputs:
      test:
        description: 'Sofort eine Test-Mitteilung schicken'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: web-push installieren
        run: npm install --no-save --no-package-lock web-push@3.6.7

      - name: Mitteilungen senden
        run: node push/send-reminders.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TEST_MESSAGE: ${{ github.event.inputs.test }}

      # Merken, was heute schon verschickt wurde, und abgelaufene Abos entfernen
      - name: Zustand sichern
        run: |
          git config user.name "health-reminders"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in reminders-state.json subscriptions.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Erinnerungen verschickt"
            git pull --rebase
            git push
          fi

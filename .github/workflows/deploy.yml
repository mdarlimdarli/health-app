# Deployt die App bei jedem Push auf main nach GitHub Pages
name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      # Nur die ausgelieferten Dateien veröffentlichen, keine Doku oder Projektdateien
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          for item in index.html manifest.webmanifest sw.js css js data assets; do
            if [ -e "$item" ]; then cp -R "$item" _site/; fi
          done

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
